<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" role="img" aria-labelledby="title desc">
  <title id="title">Treebank structure</title>
  <desc id="desc">A CoNLL-U file next to the objects it is parsed into: a treebank owns documents, documents own paragraphs, paragraphs own sentences. Sentences before the first # newdoc or # newpar go into implicit containers.</desc>
  <style>
    svg { --bg: #ffffff; --panel: #f4f6f9; --line: #d5dbe4; --fg: #1b2230; --dim: #5a6475; --faint: #8c95a5;
          --tb: #3b4a63; --doc: #0f7c74; --doc-soft: #e5f4f2; --par: #b0660c; --par-soft: #fcf1e3;
          --sent: #4a5bc4; --sent-soft: #ebeefb; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #0d1117; --panel: #151b23; --line: #2d3540; --fg: #e4e8ef; --dim: #a3acbb; --faint: #6f7889;
            --tb: #9fb0cc; --doc: #4fc4b8; --doc-soft: #12302d; --par: #e8a24c; --par-soft: #33250e;
            --sent: #8f9df0; --sent-soft: #1d2342; }
    }
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: var(--fg); }
    .mono { font-family: ui-monospace, SFMono-Regular, "Cascadia Mono", Consolas, Menlo, monospace; font-size: 12.5px; }
    .chip-t { font-family: ui-monospace, SFMono-Regular, "Cascadia Mono", Consolas, Menlo, monospace; font-size: 11.5px; fill: var(--sent); }
    .head { font-size: 11px; letter-spacing: 0.08em; fill: var(--faint); font-weight: 600; }
    .kind { font-weight: 600; font-size: 13px; }
    .meta { fill: var(--dim); font-size: 12px; }
    .tag { font-size: 9.5px; letter-spacing: 0.08em; font-weight: 700; }
    .bg { fill: var(--bg); }
    .panel { fill: var(--panel); stroke: var(--line); }
    .c-doc { fill: var(--doc); } .c-par { fill: var(--par); } .c-sent { fill: var(--sent); } .c-dim { fill: var(--faint); } .c-tok { fill: var(--dim); }
    .b-tb { fill: var(--bg); stroke: var(--tb); stroke-width: 2; }
    .b-doc { fill: var(--doc-soft); stroke: var(--doc); stroke-width: 1.5; }
    .b-par { fill: var(--par-soft); stroke: var(--par); stroke-width: 1.5; }
    .implicit { stroke-dasharray: 5 4; }
    .chip { fill: var(--sent-soft); stroke: var(--sent); }
    .tag-doc { fill: none; stroke: var(--doc); } .tag-par { fill: none; stroke: var(--par); }
    .lead { stroke-width: 1; stroke-dasharray: 2 3; opacity: 0.7; fill: none; }
    .l-doc { stroke: var(--doc); } .l-par { stroke: var(--par); } .l-sent { stroke: var(--sent); }
    .gut-doc { fill: var(--doc); } .gut-par { fill: var(--par); } .gut-sent { fill: var(--sent); }
  </style>

  <rect class="bg" width="880" height="560" rx="10"/>

  <!-- File -->
  <rect class="panel" x="20.5" y="20.5" width="380" height="496" rx="8"/>
  <text class="head" x="40" y="44">EXAMPLE.CONLLU</text>

  <rect class="gut-sent" x="28" y="86" width="3" height="20"/>
  <text class="mono c-sent" x="40" y="100"># sent_id = intro-1</text>
  <text class="mono c-tok" x="40" y="122" xml:space="preserve">1   Hello   hello   INTJ   …</text>

  <rect class="gut-doc" x="28" y="152" width="3" height="20"/>
  <text class="mono c-doc" x="40" y="166" font-weight="600"># newdoc id = d1</text>
  <rect class="gut-doc" x="28" y="174" width="3" height="20" opacity="0.45"/>
  <text class="mono c-doc" x="40" y="188"># meta::title = Letters</text>
  <rect class="gut-par" x="28" y="196" width="3" height="20"/>
  <text class="mono c-par" x="40" y="210" font-weight="600"># newpar</text>
  <rect class="gut-sent" x="28" y="218" width="3" height="20"/>
  <text class="mono c-sent" x="40" y="232"># sent_id = d1-s1</text>
  <text class="mono c-dim" x="40" y="254">…</text>

  <rect class="gut-sent" x="28" y="284" width="3" height="20"/>
  <text class="mono c-sent" x="40" y="298"># sent_id = d1-s2</text>
  <text class="mono c-dim" x="40" y="320">…</text>

  <rect class="gut-par" x="28" y="350" width="3" height="20"/>
  <text class="mono c-par" x="40" y="364" font-weight="600"># newpar id = p2</text>
  <rect class="gut-sent" x="28" y="372" width="3" height="20"/>
  <text class="mono c-sent" x="40" y="386"># sent_id = d1-s3</text>
  <text class="mono c-dim" x="40" y="408">…</text>

  <rect class="gut-doc" x="28" y="438" width="3" height="20"/>
  <text class="mono c-doc" x="40" y="452" font-weight="600"># newdoc</text>
  <rect class="gut-sent" x="28" y="460" width="3" height="20"/>
  <text class="mono c-sent" x="40" y="475"># sent_id = s4</text>
  <text class="mono c-dim" x="40" y="496">…</text>

  <!-- Leaders from file lines to objects -->
  <path class="lead l-sent" d="M192 96 H488"/>
  <path class="lead l-doc" d="M168 162 H456"/>
  <path class="lead l-doc" d="M222 184 H472"/>
  <path class="lead l-par" d="M110 206 H472"/>
  <path class="lead l-sent" d="M178 228 H488"/>
  <path class="lead l-sent" d="M178 294 H488"/>
  <path class="lead l-par" d="M168 360 H472"/>
  <path class="lead l-sent" d="M178 382 H488"/>
  <path class="lead l-doc" d="M110 448 H456"/>
  <path class="lead l-sent" d="M155 471 H488"/>

  <!-- Treebank -->
  <rect class="b-tb" x="440" y="20" width="420" height="496" rx="8"/>
  <text class="kind" x="456" y="44" fill="var(--tb)" style="fill: var(--tb)">Treebank</text>
  <text class="meta" x="526" y="44">columns, sent_id index</text>

  <!-- Document 1: implicit -->
  <rect class="b-doc implicit" x="456" y="58" width="388" height="64" rx="6"/>
  <text class="kind c-doc" x="468" y="76">Document</text>
  <rect class="tag-doc implicit" x="537.5" y="65.5" width="58" height="15" rx="3"/>
  <text class="tag c-doc" x="566.5" y="76" text-anchor="middle">IMPLICIT</text>
  <text class="meta" x="604" y="76">no marker in the file</text>

  <rect class="b-par implicit" x="472" y="84" width="356" height="30" rx="5"/>
  <rect class="chip" x="488" y="88" width="66" height="20" rx="4"/>
  <text class="chip-t" x="521" y="102" text-anchor="middle">intro-1</text>
  <rect class="tag-par implicit" x="756.5" y="91.5" width="58" height="15" rx="3"/>
  <text class="tag c-par" x="785.5" y="102" text-anchor="middle">IMPLICIT</text>
  <text class="kind c-par" x="746" y="102" text-anchor="end" font-size="12">Paragraph</text>

  <!-- Document 2: d1 -->
  <rect class="b-doc" x="456" y="148" width="388" height="266" rx="6"/>
  <text class="kind c-doc" x="468" y="166">Document</text>
  <rect class="tag-doc" x="537.5" y="155.5" width="58" height="15" rx="3"/>
  <text class="tag c-doc" x="566.5" y="166" text-anchor="middle">EXPLICIT</text>
  <text class="meta" x="604" y="166">id = d1</text>
  <text class="mono c-doc" x="472" y="188" font-size="11.5">meta::title = Letters</text>
  <text class="meta" x="828" y="188" text-anchor="end">document comment</text>

  <rect class="b-par" x="472" y="194" width="356" height="120" rx="5"/>
  <text class="kind c-par" x="484" y="210" font-size="12">Paragraph</text>
  <rect class="tag-par" x="549.5" y="199.5" width="58" height="15" rx="3"/>
  <text class="tag c-par" x="578.5" y="210" text-anchor="middle">EXPLICIT</text>
  <text class="meta" x="616" y="210">no id</text>
  <rect class="chip" x="488" y="218" width="60" height="20" rx="4"/>
  <text class="chip-t" x="518" y="232" text-anchor="middle">d1-s1</text>
  <rect class="chip" x="488" y="284" width="60" height="20" rx="4"/>
  <text class="chip-t" x="518" y="298" text-anchor="middle">d1-s2</text>

  <rect class="b-par" x="472" y="348" width="356" height="56" rx="5"/>
  <text class="kind c-par" x="484" y="364" font-size="12">Paragraph</text>
  <rect class="tag-par" x="549.5" y="353.5" width="58" height="15" rx="3"/>
  <text class="tag c-par" x="578.5" y="364" text-anchor="middle">EXPLICIT</text>
  <text class="meta" x="616" y="364">id = p2</text>
  <rect class="chip" x="488" y="372" width="60" height="20" rx="4"/>
  <text class="chip-t" x="518" y="386" text-anchor="middle">d1-s3</text>

  <!-- Document 3: no id, implicit first paragraph -->
  <rect class="b-doc" x="456" y="434" width="388" height="64" rx="6"/>
  <text class="kind c-doc" x="468" y="452">Document</text>
  <rect class="tag-doc" x="537.5" y="441.5" width="58" height="15" rx="3"/>
  <text class="tag c-doc" x="566.5" y="452" text-anchor="middle">EXPLICIT</text>
  <text class="meta" x="604" y="452">no id</text>

  <rect class="b-par implicit" x="472" y="458" width="356" height="32" rx="5"/>
  <rect class="chip" x="488" y="461" width="40" height="20" rx="4"/>
  <text class="chip-t" x="508" y="475" text-anchor="middle">s4</text>
  <rect class="tag-par implicit" x="756.5" y="464.5" width="58" height="15" rx="3"/>
  <text class="tag c-par" x="785.5" y="475" text-anchor="middle">IMPLICIT</text>
  <text class="kind c-par" x="746" y="475" text-anchor="end" font-size="12">Paragraph</text>

  <!-- Legend -->
  <rect class="b-doc" x="20" y="535" width="14" height="12" rx="2"/>
  <text class="meta" x="40" y="545">Document</text>
  <rect class="b-par" x="112" y="535" width="14" height="12" rx="2"/>
  <text class="meta" x="132" y="545">Paragraph</text>
  <rect class="chip" x="208" y="535" width="14" height="12" rx="2"/>
  <text class="meta" x="228" y="545">Sentence</text>
  <rect class="b-par implicit" x="298" y="535" width="14" height="12" rx="2" style="fill: none; stroke: var(--dim)"/>
  <text class="meta" x="318" y="545">Dashed: implicit (no marker)</text>
  <text class="meta" x="860" y="545" text-anchor="end" font-size="11">Only first documents and first paragraphs can be implicit.</text>
</svg>
